name: 'APIVerve DNS Monitor'
description: 'Verify DNS configuration, check propagation, and validate DNSSEC after deployments'
author: 'APIVerve'
branding:
  icon: 'globe'
  color: 'green'

inputs:
  api_key:
    description: 'Your APIVerve API key. Can also be set via APIVERVE_API_KEY env var.'
    required: false
  api:
    description: 'The API to use. Options: dnslookup, dnspropagation, dnsseccheck, nameservers, mxlookup'
    required: false
    default: 'dnslookup'
  params:
    description: 'JSON parameters to pass to the API'
    required: false
    default: '{}'
  output_file:
    description: 'Path to save binary output (for APIs that return files like images, PDFs)'
    required: false
  format:
    description: 'Response format: json, yaml, or xml'
    required: false
    default: 'json'
  check:
    description: 'Run a pass/fail check instead of a plain API call. Options: dns-record'
    required: false
    default: ''
  domain:
    description: 'Domain to check (used with check)'
    required: false
  record_type:
    description: 'dns-record: record type to require (A, AAAA, CNAME, MX, TXT, NS...)'
    required: false
    default: 'A'
  expected_value:
    description: 'dns-record: fail unless a record contains this value'
    required: false
  fail_on_error:
    description: 'Whether to fail the workflow if the API returns an error'
    required: false
    default: 'true'

outputs:
  result:
    description: 'The full API response as JSON'
  data:
    description: 'The data field from the API response as JSON'
  status:
    description: 'The status of the API call (ok or error)'
  file:
    description: 'Path to the downloaded file (if output_file was specified)'
  days_remaining:
    description: 'Days until expiry (ssl-expiry, domain-expiry)'
  records:
    description: 'Matching DNS records as JSON (dns-record)'

runs:
  using: 'node24'
  main: 'dist/index.js'
